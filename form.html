<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="form.css" />
  </head>
  <body>
    <div class="container">
      <h1>Register</h1>
      <div class="form-group" spellcheck="false">
        <label for="name" class="label-name form-label">
          <span>Name</span>
          <input class="input-css"
            type="text"
            name="name"
            id="name"
            placeholder="Name"
            autocomplete="off"
          />
        </label>
        <label for="email" class="label-email form-label">
          <span>Email</span>
          <input class="input-css"
            type="email"
            name="email"
            id="email"
            placeholder="Email"
            autocomplete="off"
          />
        </label>
        <label for="phone-number" class="label-phone form-label">
          <span>Phone Number</span>
          <input
          class="input-css"
            type="number"
            name="phone"
            id="phone-number"
            placeholder="Phone Number"
            autocomplete="off"
          />
        </label>
        <label for="password" class="label-pass form-label">
          <span>password</span>
          <input class="input-css" type="password" name="password" id="password" autocomplete="off" />
        </label>
        <label for="Confirm" class="label-comfirm form-label" form-label>
          <span class=>Confirm Password</span>
          <input class="input-css" type="password" name="" id="Confirm" autocomplete="off" />
        </label>
        <div class="auto">
            <label for="Male" class="labal-gender">
              <span class=""
                >Male
                <input type="checkbox" name="Male" id="Male" />
              </span>
            </label>
            <label for="female" class="labal-gender">
              <span class=""
                >Female
                <input type="checkbox" name="female" id="female" />
              </span>
              <label for="other" class="labal-gender">
                <span class=""
                  >Other
                  <input type="checkbox" name="other" id="other" />
                </span>
              </label>
        </div>
        </label>
        <label for="date" class="labelp-date form-label">
          <span>Date of Birth</span>
          <input type="date" name="date" id="date" />
        </label>
        <label for="address" class="label-address form-label">
          <span>Address</span>
          <input type="text" name="address" id="address" autocomplete="off" />
        </label>
        <label class="label-notice form-label">
          form-label Communication Preferences Chọn loại email bạn muốn nhận:
        </label>
        <label class="form-label">
            <span>Subscribe to Newsletter (Nhận bản tin định kỳ)</span>
          <input type="checkbox" name="" id="" />
        </label>
        <label class="form-label">
            <span>Receive Promotional Emails (Nhận thông tin khuyến mãi)</span>
          <input type="checkbox" name="" id="" />
        </label>
        <label class="form-label">
            <span>Get Product Updates (Nhận cập nhật sản phẩm mới)</span>
          <input type="checkbox" name="" id="" />
        </label>
        <label class="label-file form-label">
          <a>
            <input hidden type="file" name="" id="" accept="image/*" />
            <img class="label-img"
              style="height: 100px; width: 100px; display: flex"
              src="https://i.pinimg.com/736x/21/91/6e/21916e491ef0d796398f5724c313bbe7.jpg"
              alt=""
            />
          </a>
        </label>
      </div>
    </div>
  </body>
</html>
